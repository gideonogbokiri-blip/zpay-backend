databases:
  - name: zpay-db
    plan: free
    databaseName: zpay
    user: zpay

services:
  - type: web
    name: zpay-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: zpay-db
          property: connectionString