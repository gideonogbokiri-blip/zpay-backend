<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZPAY Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1114;--surface:#1a1d21;--surface2:#22262a;--border:#2d3136;--text:#e4e6ea;--muted:#8b8f96;--cyan:#00f4fe;--green:#34d399;--red:#f87171;--yellow:#fbbf24;--blue:#60a5fa}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:40px;width:100%;max-width:400px}
.login-box h1{color:var(--cyan);font-size:28px;margin-bottom:8px}
.login-box p{color:var(--muted);margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.form-group input{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none}
.form-group input:focus{border-color:var(--cyan)}
.btn{width:100%;padding:12px;background:var(--cyan);color:#000;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:default}
.error{color:var(--red);font-size:13px;margin-top:8px}
.hidden{display:none!important}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar h2{color:var(--cyan);font-size:18px}
.topbar .admin-info{color:var(--muted);font-size:13px}
.topbar button{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.topbar button:hover{border-color:var(--red);color:var(--red)}
.tabs{display:flex;gap:0;background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;overflow-x:auto}
.tab{padding:12px 20px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.content{padding:24px;max-width:1400px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px}
.stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.stat .value{font-size:28px;font-weight:700}
.stat .value.cyan{color:var(--cyan)}
.stat .value.green{color:var(--green)}
.stat .value.yellow{color:var(--yellow)}
.stat .value.red{color:var(--red)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
th{background:var(--surface2);text-align:left;padding:12px 16px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--border)}
td{padding:12px 16px;font-size:14px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(0,244,254,.03)}
.badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase}
.badge.success{background:rgba(52,211,153,.15);color:var(--green)}
.badge.failed{background:rgba(248,113,113,.15);color:var(--red)}
.badge.pending{background:rgba(251,191,36,.15);color:var(--yellow)}
.badge.tier{background:rgba(96,165,250,.15);color:var(--blue)}
.empty{text-align:center;padding:40px;color:var(--muted)}
.search{margin-bottom:16px}
.search input{padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;width:300px;outline:none}
.search input:focus{border-color:var(--cyan)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.detail-panel{position:fixed;top:0;right:0;width:480px;max-width:90vw;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:20;overflow-y:auto;padding:24px;transition:transform .2s}
.detail-panel.closed{transform:translateX(100%)}
.detail-panel h3{color:var(--cyan);margin-bottom:16px}
.detail-panel .field{margin-bottom:12px}
.detail-panel .field .label{font-size:12px;color:var(--muted);text-transform:uppercase}
.detail-panel .field .val{font-size:15px;margin-top:2px}
.detail-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19}
</style>
</head>
<body>

<div id="loginPage" class="login-wrap">
  <div class="login-box">
    <h1>ZPAY Admin</h1>
    <p>Super Admin Dashboard</p>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" value="admin@zpay.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPass" value="admin123">
    </div>
    <button class="btn" onclick="doLogin()">Sign In</button>
    <div id="loginError" class="error hidden"></div>
  </div>
</div>

<div id="dashboardPage" class="hidden">
  <div class="topbar">
    <h2>ZPAY Admin</h2>
    <div style="display:flex;align-items:center;gap:16px">
      <span class="admin-info">Super Admin</span>
      <button onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="overview">Overview</div>
    <div class="tab" data-tab="users">Users</div>
    <div class="tab" data-tab="transactions">Transactions</div>
    <div class="tab" data-tab="wallets">Wallets</div>
  </div>
  <div id="overviewTab" class="content"></div>
  <div id="usersTab" class="content hidden"></div>
  <div id="transactionsTab" class="content hidden"></div>
  <div id="walletsTab" class="content hidden"></div>
</div>

<div id="detailOverlay" class="overlay hidden" onclick="closeDetail()"></div>
<div id="detailPanel" class="detail-panel closed"></div>

<script>
const API = window.location.origin + '/api';
let token = '';
let currentTab = 'overview';

function headers(){ return {'Content-Type':'application/json','Authorization':'Bearer '+token}; }
async function api(path,opts={}){
  const r = await fetch(API+path,{...opts,headers:{...headers(),...(opts.headers||{})}});
  const j = await r.json();
  if(!r.ok) throw new Error(j.message||'Request failed');
  return j;
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  err.classList.add('hidden');
  try{
    const r = await fetch(API+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const j = await r.json();
    if(!r.ok) throw new Error(j.message);
    token = j.token;
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('dashboardPage').classList.remove('hidden');
    loadTab('overview');
  }catch(e){err.textContent=e.message;err.classList.remove('hidden')}
}

function doLogout(){
  token='';
  document.getElementById('dashboardPage').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    loadTab(t.dataset.tab);
  });
});

async function loadTab(tab){
  currentTab = tab;
  const el = document.getElementById(tab+'Tab');
  el.innerHTML = '<p><span class="spinner"></span> Loading...</p>';
  el.classList.remove('hidden');
  ['overview','users','transactions','wallets'].forEach(t=>{
    if(t!==tab) document.getElementById(t+'Tab').classList.add('hidden');
  });
  try{
    if(tab==='overview') await loadOverview(el);
    else if(tab==='users') await loadUsers(el);
    else if(tab==='transactions') await loadTransactions(el);
    else if(tab==='wallets') await loadWallets(el);
  }catch(e){el.innerHTML='<p class="empty">Error: '+e.message+'</p>'}
}

async function loadOverview(el){
  const s = await api('/admin/stats');
  const fmt = n => n.toLocaleString();
  const svcRows = Object.entries(s.serviceBreakdown||{}).map(([k,v])=>`<tr><td>${k}</td><td>${v.count}</td><td>NGN ${fmt(v.volume)}</td></tr>`).join('');
  el.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="label">Total Users</div><div class="value cyan">${s.totalUsers}</div></div>
      <div class="stat"><div class="label">Verified Users</div><div class="value green">${s.verifiedUsers}</div></div>
      <div class="stat"><div class="label">Total Transactions</div><div class="value">${s.totalTransactions}</div></div>
      <div class="stat"><div class="label">Successful</div><div class="value green">${s.successfulTransactions}</div></div>
      <div class="stat"><div class="label">Failed</div><div class="value red">${s.failedTransactions}</div></div>
      <div class="stat"><div class="label">Today</div><div class="value yellow">${s.todayTransactions}</div></div>
      <div class="stat"><div class="label">Volume</div><div class="value cyan">NGN ${fmt(s.totalVolume)}</div></div>
      <div class="stat"><div class="label">Fees Collected</div><div class="value green">NGN ${fmt(s.totalFees)}</div></div>
      <div class="stat"><div class="label">Balances Held</div><div class="value yellow">NGN ${fmt(s.totalBalanceHeld)}</div></div>
    </div>
    ${svcRows ? '<h3 style="margin-bottom:12px">Service Breakdown</h3><table><thead><tr><th>Service</th><th>Count</th><th>Volume</th></tr></thead><tbody>'+svcRows+'</tbody></table>' : '<p class="empty">No transactions yet</p>'}
  `;
}

async function loadUsers(el){
  const search = el.querySelector('.search input')?.value || '';
  const r = await api('/admin/users?search='+encodeURIComponent(search));
  const rows = r.items.map(u=>`<tr onclick="showUser('${u.id}')" style="cursor:pointer">
    <td>${u.fullName}</td><td>${u.email}</td><td>${u.phone}</td>
    <td><span class="badge tier">${u.verificationTier}</span></td>
    <td>${u.pinSet?'Yes':'No'}</td><td>NGN ${(u.walletBalance||0).toLocaleString()}</td>
    <td>${u.transactionCount}</td>
  </tr>`).join('');
  el.innerHTML = `
    <div class="search"><input type="text" placeholder="Search name, email, phone..." oninput="debounce(()=>loadUsers(document.getElementById('usersTab')))" id="userSearch"></div>
    <table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Tier</th><th>PIN</th><th>Balance</th><th>Transactions</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="7" class="empty">No users found</td></tr>'}</tbody></table>
    <p style="margin-top:8px;color:var(--muted);font-size:13px">${r.total} user(s) total</p>
  `;
  if(search) el.querySelector('#userSearch').value = search;
}

async function showUser(id){
  const u = await api('/admin/users/'+id);
  const txRows = (u.transactions||[]).slice(0,10).map(t=>`<tr>
    <td>${t.reference}</td><td>${t.service}</td><td>NGN ${t.amount}</td>
    <td><span class="badge ${t.status}">${t.status}</span></td>
    <td>${new Date(t.createdAt).toLocaleDateString()}</td>
  </tr>`).join('');
  document.getElementById('detailPanel').innerHTML = `
    <button class="detail-close" onclick="closeDetail()">&times;</button>
    <h3>${u.user.fullName}</h3>
    <div class="field"><div class="label">Email</div><div class="val">${u.user.email}</div></div>
    <div class="field"><div class="label">Phone</div><div class="val">${u.user.phone}</div></div>
    <div class="field"><div class="label">Verification</div><div class="val"><span class="badge tier">${u.user.verificationTier}</span></div></div>
    <div class="field"><div class="label">PIN Set</div><div class="val">${u.user.pinSet?'Yes':'No'}</div></div>
    <div class="field"><div class="label">Wallet Balance</div><div class="val" style="color:var(--cyan)">NGN ${(u.wallet.balance||0).toLocaleString()}</div></div>
    <h3 style="margin-top:24px">Recent Transactions (${u.transactions.length})</h3>
    ${txRows ? '<table><thead><tr><th>Ref</th><th>Service</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody>'+txRows+'</tbody></table>' : '<p class="empty">No transactions</p>'}
  `;
  document.getElementById('detailOverlay').classList.remove('hidden');
  document.getElementById('detailPanel').classList.remove('closed');
}

function closeDetail(){
  document.getElementById('detailOverlay').classList.add('hidden');
  document.getElementById('detailPanel').classList.add('closed');
}

async function loadTransactions(el){
  const r = await api('/admin/transactions');
  const rows = r.items.map(t=>`<tr>
    <td>${t.reference}</td><td>${t.userName||'User'}</td><td>${t.service}</td>
    <td>NGN ${t.amount}</td><td>NGN ${t.fee}</td>
    <td><span class="badge ${t.status}">${t.status}</span></td>
    <td>${new Date(t.createdAt).toLocaleString()}</td>
  </tr>`).join('');
  el.innerHTML = `
    <table><thead><tr><th>Reference</th><th>User</th><th>Service</th><th>Amount</th><th>Fee</th><th>Status</th><th>Date</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="7" class="empty">No transactions</td></tr>'}</tbody></table>
    <p style="margin-top:8px;color:var(--muted);font-size:13px">${r.total} transaction(s) total</p>
  `;
}

async function loadWallets(el){
  const w = await api('/admin/wallets');
  const rows = w.map(x=>`<tr>
    <td>${x.userName}</td><td>${x.email}</td><td>NGN ${x.balance.toLocaleString()}</td>
  </tr>`).join('');
  const total = w.reduce((s,x)=>s+x.balance,0);
  el.innerHTML = `
    <div class="stats"><div class="stat"><div class="label">Total Balances</div><div class="value cyan">NGN ${total.toLocaleString()}</div></div></div>
    <table><thead><tr><th>User</th><th>Email</th><th>Balance</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="3" class="empty">No wallets</td></tr>'}</tbody></table>
  `;
}

let _debounceTimer;
function debounce(fn){ clearTimeout(_debounceTimer); _debounceTimer=setTimeout(fn,300); }

document.getElementById('userSearch')?.addEventListener('input',()=>debounce(()=>loadUsers(document.getElementById('usersTab'))));
</script>
</body>
</html>
