databases:
  - name: zpay-db
    plan: free
    databaseName: zpay
    user: zpay

services:
  - type: web
    name: zpay-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_SECURE
        value: ssl
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        value: "ZPAY <zpaycontact@gmail.com>"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_URL
        value: "https://zpay-backend.onrender.com/api/webhooks/paystack"
      - key: SERVICES_VENDOR_API_KEY
        sync: false
      - key: SERVICES_DEMO_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: zpay-db
          property: connectionString